services:
  - type: web
    name: whispering-wilds
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MAX_PLAYERS_PER_ROOM
        value: 16
    healthCheckPath: /health
