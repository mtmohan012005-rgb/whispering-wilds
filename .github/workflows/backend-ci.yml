name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Backend security tests
        run: npm run test:backend

      - name: Verify game structure
        run: npm run verify-game

      - name: Verify production config
        run: npm run verify-production

      - name: Verify assets
        run: npm run verify-assets
