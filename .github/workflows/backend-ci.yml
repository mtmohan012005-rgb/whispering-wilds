name: Backend CI

on:
  push:
    branches: [ main, 'fix/**', 'unity/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Security & Validation Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency audit
        run: npm audit --audit-level=critical || true

      - name: Check JavaScript syntax
        run: |
          node --check server/server.js
          for f in server/routes/*.js server/firebase/*.js server/auth/*.js server/middleware/*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Run all tests (self-contained runner)
        run: npm test

      - name: Run game verification
        run: npm run verify-game

      - name: Run production verification
        run: npm run verify-production

      - name: Run asset verification
        run: npm run verify-assets

  security-check:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for committed secrets
        run: |
          # Check for common secret patterns in tracked files
          if git grep -l "FIREBASE_PRIVATE_KEY\|MEGA_PASSWORD\|DATABASE_URL=postgres://" -- '*.js' '*.json' '*.cs' '*.env' 2>/dev/null; then
            echo "❌ Potential secrets found in tracked files!"
            exit 1
          fi
          echo "✅ No committed secrets detected"

      - name: Check .gitignore
        run: |
          if ! grep -q ".env" .gitignore; then
            echo "❌ .env is not in .gitignore!"
            exit 1
          fi
          echo "✅ .gitignore protects .env file"

      - name: Check for MEGA remnants
        run: |
          if grep -r "megajs" package.json 2>/dev/null; then
            echo "❌ megajs dependency still present in package.json!"
            exit 1
          fi
          if [ -d "server/mega" ]; then
            echo "❌ server/mega directory still exists!"
            exit 1
          fi
          echo "✅ No MEGA remnants detected"
