name: Desktop macOS Build & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify Assets & Integrity
        run: |
          node desktop/scripts/check-assets.js
          node desktop/scripts/check-platform.js

      - name: Run Test Suites
        run: |
          node desktop/tests/platform-test.js
          node desktop/tests/window-test.js
          node desktop/tests/path-test.js
          node desktop/tests/security-test.js
          node desktop/tests/update-test.js

      - name: Build macOS Artifacts
        run: node desktop/scripts/build-macos.js

      - name: Archive macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: The-Whispering-Wilds-macOS
          path: dist/macos/
