name: Desktop Windows Build & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify Production Assets & Security
        run: |
          node desktop/scripts/check-assets.js
          node desktop/scripts/check-platform.js

      - name: Run Desktop Test Suites
        run: |
          node desktop/tests/platform-test.js
          node desktop/tests/window-test.js
          node desktop/tests/path-test.js
          node desktop/tests/ipc-test.js
          node desktop/tests/security-test.js
          node desktop/tests/update-test.js
          node desktop/tests/crash-test.js

      - name: Build Windows Packages
        run: node desktop/scripts/build-windows.js

      - name: Archive Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: The-Whispering-Wilds-Windows-x64
          path: dist/windows/
