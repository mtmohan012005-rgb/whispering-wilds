      <text x="4" y="18" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="12" fill="#00d2ff">மாமல்லபுரம் கடற்கரை</text>
    </g>
  </g>

  <g transform="translate(192, 441)">
    <circle r="14" fill="#0b1622" stroke="#00d2ff" stroke-width="3" filter="url(#glow)"/>
    <circle r="6" fill="#ffb703" />
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#0b1622" text-anchor="middle">6</text>
    
