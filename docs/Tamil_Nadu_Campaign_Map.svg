      <rect x="-8" y="-16" width="240" height="42" rx="6" fill="#08101a" fill-opacity="0.85" stroke="#223a56" stroke-width="1"/>
      <text x="4" y="0" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">3. Thanjavur & Cauvery Delta</text>
      <text x="4" y="18" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="12" fill="#00d2ff">தஞ்சாவூர் / காவிரி டெல்டா</text>
    </g>
  </g>

  <g transform="translate(528, 662)">
    <circle r="14" fill="#0b1622" stroke="#00d2ff" stroke-width="3" filter="url(#glow)"/>
    <circle r="6" fill="#ffb703" />
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#0b1622" text-anchor="middle">4</text>
    
    <!-- Label -->
