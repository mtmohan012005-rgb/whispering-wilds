<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1118"/>
      <stop offset="100%" stop-color="#121e2b"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1000" fill="url(#bgGrad)" />

  <!-- Grid Lines -->
  <g stroke="#1a2d42" stroke-width="1" stroke-dasharray="4,4">
    <line x1="80" y1="200" x2="820" y2="200" />
    <line x1="80" y1="400" x2="820" y2="400" />
    <line x1="80" y1="600" x2="820" y2="600" />
    <line x1="80" y1="800" x2="820" y2="800" />
    <line x1="200" y1="80" x2="200" y2="920" />
    <line x1="400" y1="80" x2="400" y2="920" />
    <line x1="600" y1="80" x2="600" y2="920" />
    <line x1="800" y1="80" x2="800" y2="920" />
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 60)">
    <text font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="28" fill="#e2f1ff">THE WHISPERING WILDS</text>
    <text y="32" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-weight="600" font-size="20" fill="#00d2ff">காட்டு வழி • தடம் — Campaign Navigation Map</text>
    <text y="54" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8da4be">Geographic Anchors &amp; Clue-Driven Unlock Progression</text>
  </g>

  <!-- Bay of Bengal Watermark -->
  <text x="700" y="550" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="22" fill="#16293d" letter-spacing="4">BAY OF BENGAL</text>
  <text x="700" y="575" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="16" fill="#16293d">வங்காள விரிகுடா</text>

  <!-- Campaign Progression Connecting Route -->
  <path d="M 770 164 L 688 438 L 584 544 L 528 662 L 755 242 L 192 441" fill="none" stroke="url(#routeGrad)" stroke-width="3.5" stroke-dasharray="8,6" filter="url(#glow)" />
  <path d="M 192 441 Q 420 441 420 720" fill="none" stroke="#e63946" stroke-width="3" stroke-dasharray="5,5" filter="url(#glow)" />

  <!-- Destination Nodes -->
  
  <g transform="translate(770, 164)">
    <circle r="14" fill="#0b1622" stroke="#00d2ff" stroke-width="3" filter="url(#glow)"/>
    <circle r="6" fill="#ffb703" />
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#0b1622" text-anchor="middle">1</text>
    
    <!-- Label -->
    <g transform="translate(22, -10)">
      <rect x="-8" y="-16" width="240" height="42" rx="6" fill="#08101a" fill-opacity="0.85" stroke="#223a56" stroke-width="1"/>
      <text x="4" y="0" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">1. Chennai George Town</text>
      <text x="4" y="18" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="12" fill="#00d2ff">சென்னை ஜார்ஜ் டவுன்</text>
    </g>
  </g>

  <g transform="translate(688, 438)">
