      <text x="4" y="0" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">6. Nilgiris Shola-Tea Biosphere</text>
      <text x="4" y="18" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="12" fill="#00d2ff">நீலகிரி சோலை - தேயிலை வனம்</text>
    </g>
