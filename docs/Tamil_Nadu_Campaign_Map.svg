      <text x="4" y="18" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="12" fill="#00d2ff">பிச்சாவரம் சதுப்புநிலக் காடு</text>
    </g>
  </g>

  <g transform="translate(584, 544)">
    <circle r="14" fill="#0b1622" stroke="#00d2ff" stroke-width="3" filter="url(#glow)"/>
    <circle r="6" fill="#ffb703" />
    <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#0b1622" text-anchor="middle">3</text>
    
