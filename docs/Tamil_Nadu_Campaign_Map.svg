    <circle cx="26" cy="54" r="7" fill="#00d2ff" />
    <text x="44" y="58" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">1–6: Regional Investigation Hubs</text>

    <line x1="20" y1="84" x2="36" y2="84" stroke="#ffb703" stroke-width="3" stroke-dasharray="4,3" />
    <text x="44" y="88" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Clue Unlock Journey (Chennai → Nilgiris)</text>

    <polygon points="26,110 32,122 20,122" fill="#e63946" />
    <text x="44" y="118" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">★ Sanctum Finale: Kaveri Star Seal</text>

    <text x="16" y="148" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Verified commit: ace277f • Direct3D 11 Baseline</text>
