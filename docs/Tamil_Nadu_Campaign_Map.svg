  <!-- Ancient Temple Finale (Sacred Destination) -->
  <g transform="translate(420, 720)">
    <polygon points="0,-18 16,10 -16,10" fill="#e63946" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    <circle r="4" fill="#ffdd00" />
    <g transform="translate(24, 0)">
      <rect x="-8" y="-18" width="260" height="46" rx="6" fill="#180a0d" fill-opacity="0.9" stroke="#e63946" stroke-width="1.5"/>
      <text x="4" y="-2" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#ff4d6d">★ FINALE: Ancient Temple Ruins</text>
      <text x="4" y="16" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="12" fill="#ffccd5">பழமையான திருக்கோயில் இடிபாடுகள்</text>
    </g>
  </g>

  <!-- Legend & Metadata Box -->
  <g transform="translate(60, 770)">
    <rect width="300" height="170" rx="8" fill="#08101a" fill-opacity="0.92" stroke="#223a56" stroke-width="1.5"/>
