      <rect x="-8" y="-16" width="240" height="42" rx="6" fill="#08101a" fill-opacity="0.85" stroke="#223a56" stroke-width="1"/>
      <text x="4" y="0" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#ffffff">4. Chettinad Heritage Mansion</text>
      <text x="4" y="18" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="12" fill="#00d2ff">செட்டிநாடு கானாடுகாத்தான்</text>
    </g>
