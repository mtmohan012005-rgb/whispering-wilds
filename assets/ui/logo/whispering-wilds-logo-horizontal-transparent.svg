<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" role="img" aria-labelledby="tTitle tDesc">
  <title id="tTitle">The Whispering Wilds - transparent horizontal wordmark</title>
  <desc id="tDesc">Transparent-background horizontal lockup for UI placement. Gold wordmark, pre-title, and river rule on no background fill.</desc>
  <defs>
    <linearGradient id="tGold" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#fff2c4"/>
      <stop offset="0.16" stop-color="#f8d273"/>
      <stop offset="0.38" stop-color="#D4AF37"/>
      <stop offset="0.58" stop-color="#b9761a"/>
      <stop offset="0.92" stop-color="#f6d98d"/>
      <stop offset="1" stop-color="#a8641a"/>
    </linearGradient>
    <linearGradient id="tStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f6a5c"/>
      <stop offset="1" stop-color="#2a2823"/>
    </linearGradient>
    <linearGradient id="tRiver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#2EC4B6" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="0.95"/>
      <stop offset="0.82" stop-color="#2EC4B6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </linearGradient>
    <filter id="tSoft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
    <g id="tWilds">
      <path d="M0,0 L31,0 L50,58 L66,0 L92,0 L108,58 L127,0 L158,0 L127,100 L99,100 L79,40 L59,100 L31,100 Z"/>
      <path transform="translate(176,0)" d="M0,0 L31,0 L31,100 L0,100 Z"/>
      <path transform="translate(225,0)" d="M0,0 L31,0 L31,70 L86,70 L86,100 L0,100 Z"/>
      <path transform="translate(329,0)" fill-rule="evenodd" d="M0,0 L52,0 C82,0 100,18 100,50 C100,82 82,100 52,100 L0,100 Z M31,28 L31,72 L50,72 C64,72 70,63 70,50 C70,37 64,28 50,28 Z"/>
      <path transform="translate(447,0)" fill="none" stroke-width="30" stroke-linecap="butt" d="M75,26 C75,16 63,14.5 46,14.5 C26,14.5 14.5,22 14.5,33 C14.5,46 30,49 47,53 C66,57.5 75.5,62 75.5,72 C75.5,82 62,85.5 45,85.5 C34,85.5 25,82 20,75"/>
    </g>
  </defs>
  <g transform="translate(531.5,170)">
    <use href="#tWilds" fill="url(#tStone)" transform="translate(0,6)" filter="url(#tSoft)" opacity="0.55"/>
    <use href="#tWilds" fill="url(#tGold)" stroke="url(#tGold)" stroke-width="1.2"/>
    <use href="#tWilds" fill="none" stroke="#fff6d8" stroke-width="1" opacity="0.35" transform="translate(0,-1)"/>
  </g>
  <text x="800" y="148" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="33" letter-spacing="13.5" fill="#F5EFD8" opacity="0.98">THE WHISPERING</text>
  <g opacity="0.75">
    <rect x="352" y="136" width="252" height="1.3" fill="url(#tRiver)"/>
    <rect x="996" y="136" width="252" height="1.3" fill="url(#tRiver)"/>
  </g>
  <path d="M320,300 C490,286 580,316 720,306 C860,296 920,324 1080,312 C1200,302 1260,318 1330,310" fill="none" stroke="url(#tRiver)" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
</svg>
