<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="50%" stop-color="#0c121d"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#694d03"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8ffeb"/>
      <stop offset="50%" stop-color="#55efc4"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Compass / Solar Motif Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12, 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Cardinal points -->
  <path d="M 256 60 L 262 85 L 256 80 L 250 85 Z" fill="#ff4757" />
  <path d="M 256 452 L 262 427 L 256 432 L 250 427 Z" fill="url(#goldGrad)" />
  <path d="M 452 256 L 427 262 L 432 256 L 427 250 Z" fill="url(#goldGrad)" />
  <path d="M 60 256 L 85 262 L 80 256 L 85 250 Z" fill="url(#goldGrad)" />

  <!-- Sacred Mountain & Mangrove Silhouette -->
  <path d="M 120 340 L 200 240 L 256 290 L 330 200 L 400 340 Z" fill="url(#cyanGrad)" opacity="0.25"/>
  <path d="M 150 350 L 220 270 L 256 305 L 320 230 L 375 350 Z" fill="url(#goldGrad)" opacity="0.35"/>

  <!-- Central Emblem: Sacred Lotus Glyph & Monogram -->
  <g filter="url(#glow)">
    <!-- Central Lotus Petals -->
    <path d="M 256 160 C 240 210 210 250 210 280 C 210 305 230 325 256 325 C 282 325 302 305 302 280 C 302 250 272 210 256 160 Z" fill="url(#goldGrad)"/>
    <path d="M 256 210 C 220 240 180 260 180 285 C 180 305 200 320 220 320 C 245 320 256 280 256 280 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <path d="M 256 210 C 292 240 332 260 332 285 C 332 305 312 320 292 320 C 267 320 256 280 256 280 Z" fill="url(#goldGrad)" opacity="0.85"/>
  </g>

  <!-- Bilingual Typography -->
  <text x="256" y="380" font-family="'Segoe UI', 'Noto Sans Tamil', sans-serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">காட்டு வழி</text>
  <text x="256" y="415" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="3">THE WHISPERING WILDS</text>
  <text x="256" y="440" font-family="'JetBrains Mono', monospace" font-size="12" fill="#55efc4" text-anchor="middle" letter-spacing="2">PC &amp; LAPTOP EDITION</text>
</svg>
